[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genie-workflow-evaluation"
version = "0.1.0"
description = "Source-grounded offline helpdesk workflow evaluation experiment"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
genie-eval = "genie_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
